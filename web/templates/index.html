<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A股存储板块 · 信息时间线</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="app">
  <header class="header">
    <h1>A股存储板块 · 信息时间线</h1>
    <p class="subtitle">
      聚合巨潮资讯网 / 东方财富 / 财联社 / 集微网
      <span class="live-dot" id="liveDot"></span>
      <span class="live-text" id="liveText">实时监控中</span>
    </p>
  </header>

  <div class="toolbar">
    <div class="filter-row">
      <div class="filter-group">
        <label>日期</label>
        <select id="dateFilter">
          <option value="">全部日期</option>
        </select>
      </div>
      <div class="filter-group">
        <label>情绪</label>
        <select id="sentimentFilter">
          <option value="all">全部</option>
          <option value="bullish">利好</option>
          <option value="bearish">利空</option>
          <option value="neutral">中性</option>
        </select>
      </div>
      <div class="filter-group">
        <label>关键词</label>
        <input type="text" id="keywordFilter" placeholder="搜索标题/内容...">
      </div>
      <button id="searchBtn" class="btn">搜索</button>
      <span class="refresh-info" id="refreshInfo"></span>
    </div>

    <div class="stats-bar" id="statsBar">
      <span class="stat-item">共 <strong id="statTotal">0</strong> 条</span>
      <span class="stat-item bullish">利好 <strong id="statBullish">0</strong></span>
      <span class="stat-item bearish">利空 <strong id="statBearish">0</strong></span>
      <span class="stat-item neutral">中性 <strong id="statNeutral">0</strong></span>
      <span class="stat-source">巨潮: <strong id="statCninfo">0</strong></span>
      <span class="stat-source">东财: <strong id="statEastmoney">0</strong></span>
      <span class="stat-source">财联社: <strong id="statCls">0</strong></span>
      <span class="stat-source">集微: <strong id="statJiwei">0</strong></span>
    </div>
  </div>

  <main class="timeline" id="timeline">
    <div class="loading">加载中...</div>
  </main>
</div>

<script>
const SOURCE_LABELS = { cninfo: '巨潮资讯网', eastmoney: '东方财富', cls: '财联社', jiwei: '集微网' };
const SOURCE_COLORS = { cninfo: '#6366f1', eastmoney: '#f59e0b', cls: '#ef4444', jiwei: '#10b981' };

let latestPubTime = '';  // 最新事件的时间戳，用于增量轮询
let pollTimer = null;
let lastKnownEventIds = new Set();  // 当前显示的 ID，用于判断是否要更新 DOM

// ===== 初始化 =====
document.addEventListener('DOMContentLoaded', () => {
  loadDates();
  loadEvents();

  document.getElementById('searchBtn').addEventListener('click', handleSearch);
  document.getElementById('keywordFilter').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') handleSearch();
  });

  // 开始轮询
  startPolling();
});

function handleSearch() {
  // 搜索时停止轮询，加载完重新开始
  stopPolling();
  latestPubTime = '';
  loadEvents();
  loadStats();
  startPolling();
}

// ===== 轮询 =====
function startPolling() {
  stopPolling();
  // 每30秒轮询最新数据
  pollTimer = setInterval(pollLatest, 30000);
  updateLiveStatus(true);
}

function stopPolling() {
  if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
  updateLiveStatus(false);
}

function updateLiveStatus(live) {
  const dot = document.getElementById('liveDot');
  const text = document.getElementById('liveText');
  if (live) {
    dot.className = 'live-dot live-on';
    text.textContent = '实时监控中 · 30秒刷新';
  } else {
    dot.className = 'live-dot live-off';
    text.textContent = '已暂停刷新';
  }
}

async function pollLatest() {
  try {
    let url = '/api/latest';
    if (latestPubTime) url += '?since=' + encodeURIComponent(latestPubTime);

    const resp = await fetch(url);
    const data = await resp.json();

    if (data.server_time) {
      document.getElementById('refreshInfo').textContent =
        '更新 ' + formatRelative(data.server_time);
    }

    if (data.events && data.events.length > 0) {
      // 检查是否有新事件（不在当前列表中的）
      const newIds = new Set(data.events.map(e => e.id));
      const hasNew = data.events.some(e => !lastKnownEventIds.has(e.id));

      if (hasNew || !latestPubTime) {
        // 有新数据，刷新页面
        refreshTimeline(data);
      }

      // 更新最新时间
      if (data.events[0].published_at > latestPubTime) {
        latestPubTime = data.events[0].published_at;
      }
    }
  } catch (e) {
    console.error('轮询失败:', e);
  }
}

function refreshTimeline(data) {
  lastKnownEventIds = new Set(data.events.map(e => e.id));

  const timeline = document.getElementById('timeline');
  if (!data.days || data.days.length === 0) {
    timeline.innerHTML = '<div class="empty">暂无数据，请先运行爬虫采集数据</div>';
    return;
  }

  timeline.innerHTML = data.days.map(day => {
    return renderDayGroup(day, data.grouped[day]);
  }).join('');
}

// ===== 数据加载 =====
async function loadDates() {
  try {
    const resp = await fetch('/api/dates');
    const data = await resp.json();
    const select = document.getElementById('dateFilter');
    data.dates.forEach(d => {
      const opt = document.createElement('option');
      opt.value = d;
      opt.textContent = d;
      select.appendChild(opt);
    });
  } catch (e) {
    console.error('加载日期失败:', e);
  }
}

async function loadEvents() {
  const timeline = document.getElementById('timeline');
  timeline.innerHTML = '<div class="loading">加载中...</div>';

  const params = new URLSearchParams();
  const date = document.getElementById('dateFilter').value;
  const sentiment = document.getElementById('sentimentFilter').value;
  const keyword = document.getElementById('keywordFilter').value;

  if (date) params.set('date', date);
  if (sentiment !== 'all') params.set('sentiment', sentiment);
  if (keyword) params.set('keyword', keyword);

  try {
    const resp = await fetch('/api/events?' + params.toString());
    const data = await resp.json();

    if (data.events && data.events.length > 0) {
      latestPubTime = data.events[0].published_at;
      lastKnownEventIds = new Set(data.events.map(e => e.id));
    }

    refreshTimeline(data);

    // 初始加载也更新刷新时间
    const now = new Date();
    document.getElementById('refreshInfo').textContent =
      '更新 ' + formatRelative(now.toISOString());
  } catch (e) {
    timeline.innerHTML = '<div class="error">加载失败: ' + e.message + '</div>';
  }
}

async function loadStats() {
  const params = new URLSearchParams();
  const date = document.getElementById('dateFilter').value;
  if (date) params.set('date', date);

  try {
    const resp = await fetch('/api/stats?' + params.toString());
    const data = await resp.json();

    document.getElementById('statTotal').textContent = data.total || 0;
    document.getElementById('statBullish').textContent = data.bullish || 0;
    document.getElementById('statBearish').textContent = data.bearish || 0;
    document.getElementById('statNeutral').textContent = data.neutral || 0;

    const bySrc = data.by_source || {};
    document.getElementById('statCninfo').textContent = bySrc.cninfo || 0;
    document.getElementById('statEastmoney').textContent = bySrc.eastmoney || 0;
    document.getElementById('statCls').textContent = bySrc.cls || 0;
    document.getElementById('statJiwei').textContent = bySrc.jiwei || 0;
  } catch (e) {
    console.error('加载统计失败:', e);
  }
}

// ===== 渲染 =====
function renderDayGroup(day, events) {
  const items = events.map(evt => renderEvent(evt)).join('');
  // 判断是否今天（北京时间）
  const bjNow = new Date(new Date().toLocaleString('en-US', { timeZone: 'Asia/Shanghai' }));
  const todayStr = bjNow.getFullYear() + '-' +
    String(bjNow.getMonth() + 1).padStart(2, '0') + '-' +
    String(bjNow.getDate()).padStart(2, '0');
  const dateLabel = day === todayStr ? `${day} (今天)` : day;
  return `
    <div class="day-group">
      <div class="day-header">
        <span class="day-label">${dateLabel}</span>
        <span class="day-count">${events.length} 条信息</span>
      </div>
      <div class="day-items">${items}</div>
    </div>
  `;
}

function renderEvent(evt) {
  const sentimentClass = evt.sentiment === 'bullish' ? 'sentiment-bullish' :
                         evt.sentiment === 'bearish' ? 'sentiment-bearish' : 'sentiment-neutral';

  const stockTags = (evt.stock_names || []).map(n =>
    `<span class="stock-tag">${n}</span>`
  ).join('');

  const kwTags = (evt.keywords_matched || []).slice(0, 5).map(k =>
    `<span class="kw-tag">${k}</span>`
  ).join('');

  const sourceColor = SOURCE_COLORS[evt.source] || '#999';
  const sourceLabel = SOURCE_LABELS[evt.source] || evt.source;

  return `
    <div class="event-card ${sentimentClass}">
      <div class="event-header">
        <span class="source-badge" style="background:${sourceColor}">${sourceLabel}</span>
        <span class="event-time" title="${evt.published_at || ''}">${formatRelative(evt.published_at)}</span>
      </div>
      <h3 class="event-title">
        ${evt.source_url ? `<a href="${evt.source_url}" target="_blank" rel="noopener">${escapeHtml(evt.title)}</a>` : escapeHtml(evt.title)}
      </h3>
      ${evt.summary && evt.summary !== evt.title ? `<p class="event-summary">${escapeHtml(evt.summary)}</p>` : ''}

      <div class="sentiment-bar-container">
        <div class="sentiment-bar">
          <div class="sentiment-fill bullish-fill" style="width:${evt.bullish_pct}%"></div>
          <div class="sentiment-fill bearish-fill" style="width:${evt.bearish_pct}%"></div>
        </div>
        <div class="sentiment-labels">
          <span class="bullish-label">利好 ${evt.bullish_pct}%</span>
          <span class="bearish-label">利空 ${evt.bearish_pct}%</span>
        </div>
      </div>

      <div class="event-footer">
        <div class="event-tags">
          ${stockTags}
          ${kwTags}
        </div>
      </div>
    </div>
  `;
}

// ===== 工具函数 =====
function formatRelative(isoStr) {
  if (!isoStr) return '--';
  // 统一解析为北京时间
  const dt = new Date(isoStr);
  if (isNaN(dt.getTime())) return isoStr.slice(11, 16) || '--';

  const now = new Date();
  const diffMs = now - dt;
  const diffSec = Math.floor(diffMs / 1000);
  const diffMin = Math.floor(diffSec / 60);
  const diffHour = Math.floor(diffMin / 60);
  const diffDay = Math.floor(diffHour / 24);

  if (diffSec < 0) return '刚刚';
  if (diffSec < 60) return diffSec + '秒前';
  if (diffMin < 60) return diffMin + '分钟前';
  if (diffHour < 24) return diffHour + '小时前';
  if (diffDay < 7) return diffDay + '天前';

  // 超过7天显示日期
  const month = String(dt.getMonth() + 1).padStart(2, '0');
  const day = String(dt.getDate()).padStart(2, '0');
  const hh = String(dt.getHours()).padStart(2, '0');
  const mm = String(dt.getMinutes()).padStart(2, '0');
  return `${month}-${day} ${hh}:${mm}`;
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}
</script>
</body>
</html>
